# For a nonzero-WFR condition, point this to a JSONL generated by
# transformations/spacing_transform.py. The benchmark runner does not apply
# fragmentation itself.
input_file: "data/legal_docs.jsonl"
document_type: "legal_documents"
processed_input: false

# processing
# Per-line omission probability (or needle-insertion trigger probability).
# This is not the word-fragmentation rate.
prob: 0.1
random_seed: 42
# delimiter: "\n"
# max_lines:

# evaluation
provider_models:
  - "google:gemini-3.0-flash"
# add more models if needed:
#  - "openai:gpt-5.2"
#  - "anthropic:claude-4.5-haiku"
batch_size: 5
sample_size: 100
# thinking: false
# Optional: few-shot ICL prefix text file (prepended to user prompt)
# Recommended path: data/examples.txt
# icl_file: "data/examples.txt"
# system_prompt:
# reasoning_effort: medium

# output
# IMPORTANT:
# output_dir only labels/stores the run; it does not control WFR.
# summaries/summarize_f1.py parses nominal WFR from subfolder names, so the
# label must agree with the transformed input_file.
# Use parseable suffixes such as:
#   legal_docs_seed42/ori
#   legal_docs_seed42/p_0_1
#   ...
#   legal_docs_seed42/p_1_0
output_dir: "legal_docs_seed42/ori"
